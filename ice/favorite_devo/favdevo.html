<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<style>
  table {
    margin: 0 auto;
  }
 table.steelBlueCols {
  border: 4px solid red;
  background-color: #555555;
  width: 400px;
  text-align: center;
  border-collapse: separate;
}
table.steelBlueCols td, table.steelBlueCols th {
  border: 1px solid red;
  padding: 5px 10px;
}
table.steelBlueCols tbody td {
  font-size: 12px;
  font-weight: bold;
  color: #FFFFFF;
}
table.steelBlueCols td:nth-child(even) {
  background: #398AA4;
}
table.steelBlueCols thead {
  background: #398AA4;
  border-bottom: 10px solid #398AA4;
}
table.steelBlueCols thead th {
  font-size: 15px;
  font-weight: bold;
  color: #FFFFFF;
  text-align: left;
  border-left: 2px solid #398AA4;
}
table.steelBlueCols thead th:first-child {
  border-left: none;
}

table.steelBlueCols tfoot td {
  font-size: 13px;
}
table.steelBlueCols tfoot .links {
  text-align: right;
}
table.steelBlueCols tfoot .links a{
  display: inline-block;
  background: #FFFFFF;
  color: #398AA4;
  padding: 2px 8px;
  border-radius: 5px;
}
table, th {
  border: 5px solid black;
}
form {
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
</style>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table class="steelBlueCols">
          <thead> 
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>Jeffery R. Holland</th>
            <th>The Inconvenient Messiah</th>
            <th>Brigham Young University</th>
            <th>1982</th>
          </tr>
          <tr>
            <th>Henrey J. Eyring</th>
            <th>The Power of Preparation</th>
            <th>Brigham Young University-Idaho</th>
            <th>2017</th>
          </tr>
          <tr>
            <th>Sheri L. Dew</th>
            <th>Will You Stand for Truth?</th>
            <th>Brigham Young University</th>
            <th>2003</th>
          </tr>
          </tbody>
        </table>
        <h3>New Entry</h3>
        <form>
        <label>Speaker:</label>
        <input type="text">
        <br>
        <label>Title:</label>
        <input type="text">
        <br>
        <label>Location:</label>
        <input type="text">
        <br>
        <label>Year:</label>
        <input type="text">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
