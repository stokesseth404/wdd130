<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
    body {
            background: #E8ECED;
        }

        #card {
            border: 7px solid black;
            border-radius: 20px;
            height: 600px;
            padding: 15px;
            width: 777px;
            margin: 0 auto;
            background: url("images/christus.webp");
            background-size: cover;
            background-position-x: -178px;
        }

        h1 {
            color: #FFFFFE;
            font-family: Arial;
            text-align: center;
            padding-top: 15px;

        }

        h3 {
            color: #FFFFFE;
            font-family: Arial;
            text-align: center;
            padding-top: 10px;

        }

        .pres {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 7px solid #FFFFFE;
            object-fit: cover;
        }

        .firstp {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 7px solid #FFFFFE;
            object-fit: cover;
        }

        .twelve {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 7px solid #FFFFFE;
            object-fit: cover;
        }
        
        #first-presidency {
            justify-content: center;
            display: flex;
            gap: 20px;
            align-items: center;
        
        }
        
        #twelve-apostles {
            justify-content: center;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            align-items: center;
        
        }



    
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
    <div id = "card">

    <h1>First Presidency</h1>
    <div id = "first-presidency">
    <img class="firstp" src = "images/eyring.webp" alt="Henry B. Eyring">
    <img class="pres" src = "images/oaks.webp" alt="Dalling H. Oaks">
    <img class="firstp" src="images/christofferson.webp" alt="D. Todd Chistopherson">
        </div>
    <h3>Quorum of the Twelve Apostles</h3>
    <div id = "twelve-apostles">
    <img class="twelve" src = "images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
    <img class="twelve" src = "images/bednar.webp" alt="David A. Bednar">
    <img class="twelve" src = "images/cook.webp" alt="Quentin L. Cook">
    <img class="twelve" src = "images/anderson.webp" alt="Neil L. Andersen">
    <img class="twelve" src = "images/rasband.webp" alt="Ronald A. Rasband">
    <img class="twelve" src = "images/stevenson.webp" alt="Gary E. Stevenson">
    <img class="twelve" src = "images/renlund.webp" alt="Dale G. Renlund">
    <img class="twelve" src = "images/gong.webp" alt="Gerrit W. Gong">
    <img class="twelve" src = "images/soares.webp" alt="Ulisses Soares">
    <img class="twelve" src = "images/kearon.webp" alt="Patrick Kearon">
    <img class="twelve" src = "images/causse.webp" alt="Gerald Causse">
    <img class="twelve" src = "images/gilbert.webp" alt="Clark G. Gilbert">
        </div>
    
    </div>
</body>
</html>
